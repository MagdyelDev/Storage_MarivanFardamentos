<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marivan Fardamentos - Estoque</title>
    <link rel="stylesheet" href="../style/admin.css" />
  </head>
  <body>
    <div class="login-container">
      <h2>Gestão de Usuários</h2>
      <div id="message" class="message"></div>

      <div class="input-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite o nome do usuário" />
      </div>

      <div class="input-group">
        <label for="email">E-Mail:</label>
        <input type="email" id="email" placeholder="Digite seu Email.." />
      </div>

      <div class="input-group">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" placeholder="Digite sua Senha.." />
      </div>

      <button class="btn-entrar" id="btnCriar">CRIAR ACESSO</button>
      <small>Use este painel para criar os acessos dos Usuários.</small>
    </div>

    <script src="../js/admin.js"></script>
  </body>
</html>
