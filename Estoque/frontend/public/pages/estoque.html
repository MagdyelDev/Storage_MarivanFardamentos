<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estoque - Marivan Fardamentos</title>
    <link rel="stylesheet" href="../style/estoque.css" />
  </head>
  <body>
    <header>
      <div class="logo-container">
        <img src="../assets/img/logo.png" alt="Logo Marivan" class="logo" />
        <div>
          <h1>Gestão de Estoque</h1>
          <p>Início > Estoque</p>
        </div>
      </div>

      <div class="actions">
        <a href="/pages/index.html">Voltar ao painel</a>
        <button onclick="logout()">Sair</button>
      </div>
    </header>

    <main>
      <section class="card">
        <form id="produtoForm">
          <input type="hidden" id="produtoId" />
          <input type="number" id="codigo" placeholder="Código do item" min="0" step="1" inputmode="numeric" required />
          <input type="text" id="nome" placeholder="Nome do produto" required />
          <input type="number" id="quantidade" placeholder="Quantidade" min="0" required />
          <input type="number" id="preco" placeholder="Preço unitário" min="0" step="0.01" required />
          <button type="submit">Salvar produto</button>
          <button type="button" class="btn-secondary" id="btnCancelar">Limpar</button>
        </form>
      </section>

      <section class="card">
        <div class="controls">
          <h2>Produtos cadastrados</h2>
          <input type="search" id="filtro" placeholder="Buscar por nome ou código do produto" />
        </div>
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Nome</th>
              <th>Quantidade</th>
              <th>Preço unitário</th>
              <th>Valor total</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="listaProdutos"></tbody>
        </table>
      </section>
    </main>

    <script src="../js/estoque.js?v=2"></script>
  </body>
</html>
